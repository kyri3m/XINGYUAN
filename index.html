<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>环境监测采样派单系统</title>
<style>
:root {
  --primary: #1677ff; --success: #52c41a; --warning: #faad14; --danger: #ff4d4f;
  --bg: #f5f5f5; --card: #fff; --text: #262626; --text2: #595959; --text3: #8c8c8c;
  --border: #e8e8e8; --radius: 8px; --shadow: 0 1px 3px rgba(0,0,0,.08);
  --sidebar-w: 220px; --header-h: 52px;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);display:flex;min-height:100vh}

/* Sidebar */
.sidebar{width:var(--sidebar-w);background:#001529;color:#fff;display:flex;flex-direction:column;position:fixed;top:0;left:0;bottom:0;z-index:100}
.sidebar .logo{padding:16px 20px;font-size:16px;font-weight:700;border-bottom:1px solid rgba(255,255,255,.1);display:flex;align-items:center;gap:8px}
.sidebar .logo .dot{width:8px;height:8px;border-radius:50%;background:var(--primary)}
.sidebar nav{flex:1;padding:8px 0;overflow-y:auto}
.sidebar .nav-group{padding:8px 20px 4px;font-size:11px;color:rgba(255,255,255,.4);text-transform:uppercase;letter-spacing:1px}
.sidebar .nav-item{display:flex;align-items:center;gap:10px;padding:10px 20px;cursor:pointer;font-size:14px;color:rgba(255,255,255,.65);transition:all .2s;border-left:3px solid transparent}
.sidebar .nav-item:hover{color:#fff;background:rgba(255,255,255,.06)}
.sidebar .nav-item.active{color:#fff;background:var(--primary);border-left-color:#fff}
.sidebar .nav-item .icon{font-size:16px;width:20px;text-align:center}
.sidebar .user-area{padding:12px 20px;border-top:1px solid rgba(255,255,255,.1);display:flex;align-items:center;gap:10px;cursor:pointer;font-size:13px}
.sidebar .user-area .avatar{width:32px;height:32px;border-radius:50%;background:var(--primary);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px}

/* Main */
.main{margin-left:var(--sidebar-w);flex:1;display:flex;flex-direction:column;min-height:100vh}
.header{height:var(--header-h);background:var(--card);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 20px;gap:16px;position:sticky;top:0;z-index:50}
.header h2{font-size:16px;font-weight:600}
.header .role-badge{padding:2px 10px;border-radius:12px;font-size:12px;font-weight:500}
.header .role-badge.admin{background:#e6f4ff;color:var(--primary)}
.header .role-badge.worker{background:#f6ffed;color:var(--success)}
.header .actions{margin-left:auto;display:flex;gap:8px;align-items:center}
.content{padding:16px 20px;flex:1;overflow-y:auto}

/* Cards & Grid */
.stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
.stat-card{background:var(--card);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow)}
.stat-card .val{font-size:28px;font-weight:700}
.stat-card .lbl{font-size:12px;color:var(--text3);margin-top:4px}
.stat-card.c1 .val{color:var(--primary)}
.stat-card.c2 .val{color:var(--warning)}
.stat-card.c3 .val{color:var(--success)}
.stat-card.c4 .val{color:var(--danger)}

.panel{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);margin-bottom:12px}
.panel-header{padding:14px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.panel-header h3{font-size:14px;font-weight:600}
.panel-body{padding:16px;overflow-x:auto}

/* Table */
table{width:100%;border-collapse:collapse;font-size:13px}
th{background:#fafafa;padding:10px 12px;text-align:left;font-weight:600;border-bottom:2px solid var(--border);white-space:nowrap;color:var(--text2)}
td{padding:8px 12px;border-bottom:1px solid var(--border)}
tr:hover{background:#fafafa}

/* Tags */
.tag{display:inline-block;padding:2px 8px;border-radius:4px;font-size:11px;font-weight:500}
.tag-info{background:#e6f4ff;color:var(--primary)}
.tag-success{background:#f6ffed;color:var(--success)}
.tag-warning{background:#fffbe6;color:#d48806}
.tag-danger{background:#fff2e8;color:var(--danger)}
.tag-default{background:#f5f5f5;color:var(--text3)}

/* Buttons */
.btn{padding:6px 14px;border-radius:6px;font-size:13px;cursor:pointer;border:1px solid var(--border);background:#fff;color:var(--text);display:inline-flex;align-items:center;gap:4px;transition:all .2s}
.btn:hover{opacity:.85}
.btn-primary{background:var(--primary);color:#fff;border-color:var(--primary)}
.btn-success{background:var(--success);color:#fff;border-color:var(--success)}
.btn-danger{background:var(--danger);color:#fff;border-color:var(--danger)}
.btn-sm{padding:3px 10px;font-size:12px}
.btn-ghost{background:transparent;border-color:var(--border)}

/* Forms */
.form-row{display:flex;gap:12px;margin-bottom:12px;flex-wrap:wrap}
.form-group{flex:1;min-width:160px}
.form-group label{display:block;font-size:12px;color:var(--text2);margin-bottom:4px;font-weight:500}
.form-group input,.form-group select,.form-group textarea{width:100%;padding:7px 10px;border:1px solid var(--border);border-radius:6px;font-size:13px;outline:none;transition:border .2s}
.form-group input:focus,.form-group select:focus{border-color:var(--primary);box-shadow:0 0 0 2px rgba(22,119,255,.1)}

/* Modal */
.modal-overlay{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.45);z-index:200;align-items:center;justify-content:center}
.modal-overlay.show{display:flex}
.modal{background:var(--card);border-radius:12px;width:90%;max-width:700px;max-height:85vh;overflow-y:auto;box-shadow:0 6px 30px rgba(0,0,0,.15)}
.modal-header{padding:16px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.modal-header h3{font-size:16px}
.modal-body{padding:20px}
.modal-footer{padding:12px 20px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:8px}

/* Page panels */
.page{display:none}
.page.active{display:block}

/* Calendar Strip */
.calendar-strip{display:flex;gap:4px;overflow-x:auto;padding:4px 0;margin-bottom:12px}
.cal-day{min-width:120px;background:var(--card);border-radius:var(--radius);padding:10px;text-align:center;border:2px solid transparent;cursor:pointer;flex-shrink:0}
.cal-day:hover{border-color:var(--primary)}
.cal-day.active{border-color:var(--primary);background:#e6f4ff}
.cal-day .dow{font-size:11px;color:var(--text3)}
.cal-day .date{font-size:18px;font-weight:700}
.cal-day .count{font-size:11px;color:var(--primary);margin-top:2px}

/* Progress Bar */
.progress-bar{height:6px;background:#f0f0f0;border-radius:3px;overflow:hidden;min-width:60px}
.progress-bar .fill{height:100%;border-radius:3px;transition:width .3s}
.fill-blue{background:var(--primary)}
.fill-green{background:var(--success)}
.fill-warning{background:var(--warning)}

/* Toast */
.toast{position:fixed;top:16px;left:50%;transform:translateX(-50%);background:#333;color:#fff;padding:10px 20px;border-radius:20px;font-size:13px;z-index:300;opacity:0;transition:opacity .3s}
.toast.show{opacity:1}

/* Responsive */  
@media(max-width:768px){.sidebar{width:60px}.sidebar .nav-item span:not(.icon),.sidebar .nav-group,.sidebar .logo span,.sidebar .user-area span{display:none}.sidebar .logo{justify-content:center;padding:16px 0}.sidebar .nav-item{justify-content:center;padding:12px 0}.main{margin-left:60px}.stats-grid{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>

<!-- Sidebar -->
<div class="sidebar">
  <div class="logo"><span class="dot"></span><span>环境监测派单</span></div>
  <nav>
    <div class="nav-group">管理端</div>
    <div class="nav-item admin-only active" data-page="dashboard"><span class="icon">📊</span><span>工作台</span></div>
    <div class="nav-item admin-only" data-page="tasks"><span class="icon">📋</span><span>任务管理</span></div>
    <div class="nav-item admin-only" data-page="dispatch"><span class="icon">📅</span><span>周派单计划</span></div>
    <div class="nav-item admin-only" data-page="personnel"><span class="icon">👥</span><span>人员管理</span></div>
    <div class="nav-item admin-only" data-page="companies"><span class="icon">🏢</span><span>企业管理</span></div>
    <div class="nav-group">使用端</div>
    <div class="nav-item worker-only" data-page="mytasks"><span class="icon">📝</span><span>我的任务</span></div>
    <div class="nav-item worker-only" data-page="sampling"><span class="icon">🧪</span><span>现场采样</span></div>
    <div class="nav-item worker-only" data-page="history"><span class="icon">📦</span><span>历史记录</span></div>
  </nav>
  <div class="user-area" id="userSwitcher">
    <div class="avatar" id="userAvatar">管</div>
    <span id="userName">管理员</span>
  </div>
</div>

<!-- Main -->
<div class="main">
  <div class="header">
    <h2 id="pageTitle">工作台</h2>
    <span class="role-badge admin" id="roleBadge">管理端</span>
    <div class="actions" id="headerActions"></div>
  </div>
  <div class="content" id="contentArea"></div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<!-- Modal -->
<div class="modal-overlay" id="modalOverlay"><div class="modal" id="modalBox"></div></div>

<script>
// ==================== DATA LAYER ====================
const DB_KEY = 'dispatch_db_v2';

const defaultPersonnel = [
  '戴吉摇','李磊','苏骏飞','齐胜男','郭继凡','孙卫文','徐成','祝建','黎健','陈硕',
  '孙耀辉','程跃','江涛','何子龙','陈向浩','史文侯','胡文龙','杨建东','何子昂','万翔','孟祥泽','赵阿康'
].map((name,i)=>({id:'P'+(i+1),name,phone:'',role:i<4?'组长':'组员',status:'active'}));

const defaultCompanies = [
  {id:'C1',name:'安徽美程化工有限公司',region:'滁州定远',contact:'聂亚多',phone:'18756419562',epaAccount:'',onlineAccount:''},
  {id:'C2',name:'滁州东涂化学新材料科技有限公司',region:'滁州定远',contact:'郑严',phone:'18019811106',epaAccount:'',onlineAccount:''},
  {id:'C3',name:'安徽泉盛化工有限公司',region:'滁州定远',contact:'常雪峰',phone:'13956759881',epaAccount:'',onlineAccount:''},
  {id:'C4',name:'安徽华塑股份有限公司',region:'滁州定远',contact:'邵保成',phone:'15756056766',epaAccount:'hwasu2012',onlineAccount:'hsgf'},
  {id:'C5',name:'安徽华尔泰化工股份有限公司',region:'池州',contact:'张燕',phone:'18226967898',epaAccount:'',onlineAccount:''},
  {id:'C6',name:'安徽口子酒业股份有限公司东山厂区',region:'淮北',contact:'唐新村',phone:'13195618285',epaAccount:'anhuikouzijiuye2',onlineAccount:''},
  {id:'C7',name:'绿十字（中国）生物制品有限公司',region:'淮南',contact:'杨晨',phone:'17352953308',epaAccount:'',onlineAccount:''},
  {id:'C8',name:'安徽古井贡酒股份有限公司',region:'亳州',contact:'孙祥',phone:'15055817698',epaAccount:'',onlineAccount:''},
  {id:'C9',name:'安徽六国化工股份有限公司',region:'铜陵',contact:'吴杰',phone:'18056219600',epaAccount:'',onlineAccount:''},
  {id:'C10',name:'安徽省庐峰镀锌有限公司',region:'合肥',contact:'汪大胜',phone:'18055155335',epaAccount:'',onlineAccount:''},
  {id:'C11',name:'安徽金安不锈钢铸造有限公司',region:'六安',contact:'陈思源',phone:'13515608203',epaAccount:'',onlineAccount:''},
  {id:'C12',name:'安徽阳城化工科技有限公司',region:'滁州定远',contact:'范家奎',phone:'18355058960',epaAccount:'',onlineAccount:''},
];

const ds = ['2026-06-01','2026-06-02','2026-06-03','2026-06-04','2026-06-05','2026-06-06','2026-06-07',
  '2026-06-08','2026-06-09','2026-06-10','2026-06-11','2026-06-12','2026-06-13','2026-06-14'];

const defaultTasks = [];

const defaultSamplingRecords = [];

const initDB = {
  personnel: defaultPersonnel,
  companies: defaultCompanies,
  tasks: defaultTasks,
  samplingRecords: defaultSamplingRecords,
  currentUser: {id:'P0',name:'管理员',role:'admin'},
  nextIds: {task:1,company:13,personnel:23,sampling:1}
};

function loadDB(){try{const d=localStorage.getItem(DB_KEY);return d?JSON.parse(d):JSON.parse(JSON.stringify(initDB))}catch(e){return JSON.parse(JSON.stringify(initDB))}}
function saveDB(db=null){if(!db)db=App.db;localStorage.setItem(DB_KEY,JSON.stringify(db))}

const App = {db:loadDB(),page:'dashboard'};
if(!localStorage.getItem(DB_KEY)) saveDB(App.db);

// ==================== HELPERS ====================
function $(sel){return document.querySelector(sel)}
function $$(sel){return document.querySelectorAll(sel)}
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2000)}
function fmtDate(d){if(!d)return'';const p=new Date(d);return `${p.getMonth()+1}/${p.getDate()}`}
function getPerson(id){return App.db.personnel.find(p=>p.id===id)}
function getPeople(ids){if(!ids)return'';return ids.split(',').map(id=>{const p=getPerson(id.trim());return p?p.name:id}).join('、')}
function getCompany(id){return App.db.companies.find(c=>c.id===id)}
function getCompanyName(id){const c=getCompany(id);return c?c.name:id||''}
function statusTag(s){
  const m={pending:['待执行','warning'],progress:['进行中','info'],done:['已完成','success'],cancelled:['已取消','danger']};
  const [t,c]=m[s]||['未知','default'];return `<span class="tag tag-${c}">${t}</span>`;
}
function isAdmin(){return App.db.currentUser.role==='admin'}
function nextId(type){const key=type+'Id' in App.db.nextIds ? type+'Id' : type;const n=App.db.nextIds[type];App.db.nextIds[type]=n+1;saveDB();return type[0].toUpperCase()+n}

// ==================== ROUTING ====================
function navigate(page){
  App.page=page;
  $$('.nav-item').forEach(n=>n.classList.remove('active'));
  const nav=document.querySelector(`.nav-item[data-page="${page}"]`);
  if(nav)nav.classList.add('active');
  const titles={dashboard:'工作台',tasks:'任务管理',dispatch:'周派单计划',personnel:'人员管理',companies:'企业管理',mytasks:'我的任务',sampling:'现场采样',history:'历史记录'};
  $('#pageTitle').textContent=titles[page]||page;
  renderPage(page);
  updateRoleUI();
}

function updateRoleUI(){
  const admin=isAdmin();
  $$('.admin-only').forEach(e=>e.style.display=admin?'':'none');
  $$('.worker-only').forEach(e=>e.style.display=admin?'none':'');
  const badge=$('#roleBadge');
  badge.textContent=admin?'管理端':'使用端';
  badge.className='role-badge '+(admin?'admin':'worker');
  $('#userAvatar').textContent=admin?'管':(App.db.currentUser.name||'员')[0];
  $('#userName').textContent=admin?'管理员':App.db.currentUser.name;
}

// ==================== USER SWITCHER ====================
$('#userSwitcher').addEventListener('click',()=>{
  if(isAdmin()){
    const html='<h3>切换身份</h3><div style="display:flex;flex-wrap:wrap;gap:8px;margin-top:12px">'+
      '<button class="btn" onclick="switchToAdmin()" style="'+(isAdmin()?'background:#e6f4ff;border-color:var(--primary)':'')+'">🔧 管理员</button>'+
      App.db.personnel.filter(p=>p.status==='active').map(p=>
        '<button class="btn" onclick="switchToWorker(\''+p.id+'\')">👤 '+p.name+'</button>'
      ).join('')+'</div>';
    showModal('切换身份',html,null);
  }else{
    switchToAdmin();
  }
});

function switchToAdmin(){App.db.currentUser={id:'P0',name:'管理员',role:'admin'};saveDB();navigate('dashboard')}
function switchToWorker(pid){const p=getPerson(pid);if(!p)return;App.db.currentUser={id:p.id,name:p.name,role:'worker'};saveDB();closeModal();navigate('mytasks')}

// ==================== MODAL ====================
function showModal(title,body,footer){
  $('#modalBox').innerHTML=`
    <div class="modal-header"><h3>${title}</h3><button class="btn btn-ghost btn-sm" onclick="closeModal()">✕</button></div>
    <div class="modal-body">${body}</div>
    ${footer?`<div class="modal-footer">${footer}</div>`:''}`;
  $('#modalOverlay').classList.add('show');
}
function closeModal(){$('#modalOverlay').classList.remove('show')}
$('#modalOverlay').addEventListener('click',e=>{if(e.target===$('#modalOverlay'))closeModal()});

// ==================== PAGE: DASHBOARD ====================
function renderDashboard(){
  const tasks=App.db.tasks;
  const stats={
    total:tasks.length,
    pending:tasks.filter(t=>t.status==='pending').length,
    progress:tasks.filter(t=>t.status==='progress').length,
    done:tasks.filter(t=>t.status==='done').length
  };
  const today=new Date().toISOString().slice(0,10);
  const todayTasks=tasks.filter(t=>t.dateStart<=today&&t.dateEnd>=today);

  const html=`
    <div class="stats-grid">
      <div class="stat-card c1"><div class="val">${stats.total}</div><div class="lbl">总任务数</div></div>
      <div class="stat-card c2"><div class="val">${stats.pending}</div><div class="lbl">待执行</div></div>
      <div class="stat-card c3"><div class="val">${stats.progress}</div><div class="lbl">进行中</div></div>
      <div class="stat-card c4"><div class="val">${stats.done}</div><div class="lbl">已完成</div></div>
    </div>
    <div class="panel">
      <div class="panel-header"><h3>📌 今日任务 (${today})</h3></div>
      <div class="panel-body">
        ${todayTasks.length===0?'<p style="color:var(--text3);padding:20px;text-align:center">今日无任务</p>':
          `<table><thead><tr><th>项目编号</th><th>受检单位</th><th>负责人</th><th>组员</th><th>检测类别</th><th>状态</th><th>计划时长</th></tr></thead><tbody>
          ${todayTasks.map(t=>`<tr>
            <td><strong>${t.pid}</strong></td><td>${getCompanyName(t.company)}</td><td>${getPeople(t.leader)}</td>
            <td>${getPeople(t.members)}</td><td>${t.types}</td><td>${statusTag(t.status)}</td><td>${t.plannedHrs}h</td>
          </tr>`).join('')}</tbody></table>`}
      </div>
    </div>
    <div class="panel">
      <div class="panel-header"><h3>⏳ 待执行任务 (${stats.pending})</h3></div>
      <div class="panel-body">
        <table><thead><tr><th>项目编号</th><th>受检单位</th><th>采样日期</th><th>负责人</th><th>检测类别</th><th>时长</th><th>操作</th></tr></thead><tbody>
        ${tasks.filter(t=>t.status==='pending').slice(0,10).map(t=>`<tr>
          <td><strong>${t.pid}</strong></td><td>${getCompanyName(t.company)}</td><td>${fmtDate(t.dateStart)}~${fmtDate(t.dateEnd)}</td>
          <td>${getPeople(t.leader)}</td><td>${t.types}</td><td>${t.plannedHrs}h</td>
          <td><button class="btn btn-primary btn-sm" onclick="startTask('${t.id}')">开始</button></td>
        </tr>`).join('')}</tbody></table>
      </div>
    </div>`;
  $('#contentArea').innerHTML=html;
  $('#headerActions').innerHTML='<button class="btn btn-primary" onclick="navigate(\'tasks\')">+ 新建任务</button>';
}

function startTask(taskId){
  const t=App.db.tasks.find(x=>x.id===taskId);
  if(!t)return;
  t.status='progress';
  saveDB();
  toast(`✅ 任务 ${t.pid} 已开始`);
  renderDashboard();
}

// ==================== PAGE: TASK MANAGEMENT ====================
function renderTasks(filter='all'){
  const tasks=App.db.tasks;
  let filtered=filter==='all'?tasks:tasks.filter(t=>t.status===filter);

  const html=`
    <div style="display:flex;gap:8px;margin-bottom:12px">
      ${['all','pending','progress','done'].map(f=>
        `<button class="btn ${filter===f?'btn-primary':'btn-ghost'} btn-sm" onclick="renderTasks('${f}')">${f==='all'?'全部':f==='pending'?'待执行':f==='progress'?'进行中':'已完成'}</button>`
      ).join('')}
      <button class="btn btn-primary btn-sm" style="margin-left:auto" onclick="showTaskForm()">+ 新建任务</button>
    </div>
    <div class="panel">
      <div class="panel-body">
        <table><thead><tr><th>项目编号</th><th>受检单位</th><th>采样日期</th><th>负责人</th><th>组员</th><th>类别</th><th>计划时长</th><th>状态</th><th>操作</th></tr></thead><tbody>
        ${filtered.map(t=>`<tr>
          <td><strong>${t.pid}</strong></td><td>${getCompanyName(t.company)}</td><td>${fmtDate(t.dateStart)}~${fmtDate(t.dateEnd)}</td>
          <td>${getPeople(t.leader)}</td><td>${getPeople(t.members)}</td><td>${t.types}</td>
          <td>${t.plannedHrs}h${t.actualHrs?` / 实际${t.actualHrs}h`:''}</td>
          <td>${statusTag(t.status)}</td>
          <td>
            <button class="btn btn-sm" onclick="editTask('${t.id}')">编辑</button>
            <button class="btn btn-sm btn-danger" onclick="deleteTask('${t.id}')">删除</button>
          </td>
        </tr>`).join('')}</tbody></table>
      </div>
    </div>`;
  $('#contentArea').innerHTML=html;
  $('#headerActions').innerHTML='';

function saveTask(){

    dateStart:$('#tf_start').value, dateEnd:$('#tf_end').value,

    members:Array.from($('#tf_members').selectedOptions).map(o=>o.value).join(','),
    types:$('#tf_types').value, status:$('#tf_status').value, note:$('#tf_note').value
  };
  if(!data.pid||!data.company||!data.dateStart||!data.leader){toast('请填写必填项');return}

}

// ==================== PAGE: DISPATCH (WEEKLY PLAN) ====================
function renderDispatch(){
  const tasks=App.db.tasks;

  // Build week data
  const weeks=[];
  for(let i=0;i<14;i+=7){
    const wd=ds.slice(i,i+7);
    weeks.push({label:`第${Math.floor(i/7)+1}周 (${fmtDate(wd[0])}~${fmtDate(wd[wd.length-1])})`,days:wd});
  }

  let activeWeek=0;
  const html=`
    <div style="display:flex;gap:8px;margin-bottom:12px">
      ${weeks.map((w,i)=>`<button class="btn ${i===activeWeek?'btn-primary':'btn-ghost'} btn-sm" onclick="renderDispatchWeek(${i})">${w.label}</button>`).join('')}
    </div>
    <div class="panel" id="dispatchPanel"></div>`;
  $('#contentArea').innerHTML=html;
  $('#headerActions').innerHTML='<button class="btn btn-primary" onclick="showTaskForm()">+ 新建任务</button>';
  renderDispatchWeek(0);
}

function renderDispatchWeek(weekIdx){
  const wd=ds.slice(weekIdx*7,weekIdx*7+7);
  const tasks=App.db.tasks.filter(t=>{
    return t.dateStart<=wd[wd.length-1]&&t.dateEnd>=wd[0];
  });

  // Group by day
  const dayTasks={};
  wd.forEach(d=>{dayTasks[d]=tasks.filter(t=>t.dateStart<=d&&t.dateEnd>=d)});

  const html=`
    <div class="panel-body">
      <table style="table-layout:fixed">
      <thead><tr>
        ${wd.map(d=>{
          const dt=new Date(d);const dows=['日','一','二','三','四','五','六'];
          const cnt=dayTasks[d].length;
          return `<th style="text-align:center">${fmtDate(d)}<br><small style="color:var(--text3)">周${dows[dt.getDay()]}</small><br><span style="color:var(--primary);font-size:12px">${cnt}任务</span></th>`;
        }).join('')}
      </tr></thead>
      <tbody><tr>
        ${wd.map(d=>`<td style="vertical-align:top;padding:6px">
          ${dayTasks[d].map(t=>`<div style="background:#f6f8fa;border-radius:4px;padding:6px;margin-bottom:4px;font-size:11px;border-left:3px solid ${t.status==='done'?'var(--success)':t.status==='progress'?'var(--primary)':'var(--warning)'};cursor:pointer" onclick="editTask('${t.id}')" title="${t.note||''}">
            <strong>${t.pid}</strong><br>${getCompanyName(t.company)}<br>
            ${getPeople(t.leader).slice(0,10)} | ${t.plannedHrs}h
          </div>`).join('')}
          ${dayTasks[d].length===0?'<span style="color:var(--text3);font-size:11px">-</span>':''}
        </td>`).join('')}
      </tr></tbody></table>
    </div>`;
  document.getElementById('dispatchPanel').innerHTML=html;

  // Update week buttons
  const btns=document.querySelectorAll('#contentArea .btn');
  btns.forEach((b,i)=>{
    if(i<2) b.className=`btn ${i===weekIdx?'btn-primary':'btn-ghost'} btn-sm`;
  });
}

function removePortItem(btn){
  const items=document.querySelectorAll('.port-item');
  if(items.length<=1){toast('至少保留一个排口');return}
  btn.closest('.port-item').remove();
}

function previewPortPhotos(input){
  const preview=input.closest('div').querySelector('.port-preview');
  preview.innerHTML='';
  const files=Array.from(input.files);
  files.forEach(f=>{
    const reader=new FileReader();
    reader.onload=function(e){
      const img=document.createElement('img');
      img.src=e.target.result;
      img.style.cssText='width:48px;height:48px;object-fit:cover;border-radius:4px;border:1px solid var(--border)';
      preview.appendChild(img);
    };
    reader.readAsDataURL(f);
  });
}

function submitSampling(){
  const taskId=document.getElementById('sm_taskId').value;
  const portEls=document.querySelectorAll('.port-item');
  let hasContent=false;
  const ports=[];
  portEls.forEach(el=>{
    const name=el.querySelector('.port-name').value.trim();
    const note=el.querySelector('.port-note').value.trim();
    const fileInput=el.querySelector('.port-photos');
    const photos=Array.from(fileInput.files).map(f=>f.name);
    if(name||note||photos.length>0) hasContent=true;
    ports.push({name,note,photoCount:photos.length,photoNames:photos});
  });
  if(!hasContent){toast('请至少填写一个排口信息');return}

  const record={
    id:nextId('sampling'),taskId,date:new Date().toISOString().slice(0,10),
    sampler:App.db.currentUser.name,ports,
    createdAt:new Date().toISOString()
  };
  App.db.samplingRecords.push(record);
  saveDB();closeModal();renderSampling();
  toast('✅ 采样记录已提交');
}

function submitSampleAndComplete(){
  const taskId=document.getElementById('sm_taskId').value;
  // First save the record
  const portEls=document.querySelectorAll('.port-item');
  let hasContent=false;
  const ports=[];
  portEls.forEach(el=>{
    const name=el.querySelector('.port-name').value.trim();
    const note=el.querySelector('.port-note').value.trim();
    const fileInput=el.querySelector('.port-photos');
    const photos=Array.from(fileInput.files).map(f=>f.name);
    if(name||note||photos.length>0) hasContent=true;
    ports.push({name,note,photoCount:photos.length,photoNames:photos});
  });
  if(hasContent){
    const record={
      id:nextId('sampling'),taskId,date:new Date().toISOString().slice(0,10),
      sampler:App.db.currentUser.name,ports,
      createdAt:new Date().toISOString()
    };
    App.db.samplingRecords.push(record);
  }
  // Mark task done
  const t=App.db.tasks.find(x=>x.id===taskId);
  if(t){t.status='done';t.actualHrs=parseFloat(prompt('实际用时(h):',t.plannedHrs))||t.plannedHrs;saveDB()}
  closeModal();renderSampling();toast('🎉 任务已完成');
}

function completeTask(taskId){
  const t=App.db.tasks.find(x=>x.id===taskId);
  if(!t)return;
  const hrs=parseFloat(prompt('实际用时(h):',t.plannedHrs));
  if(hrs!==null&&!isNaN(hrs)){t.actualHrs=hrs}
  t.status='done';saveDB();renderSampling();toast('🎉 任务已完成');
}

// ==================== PAGE: HISTORY (WORKER) ====================
function renderHistory(){
  const uid=App.db.currentUser.id;
  const tasks=App.db.tasks.filter(t=>((t.leader||'').includes(uid)||(t.members||'').includes(uid))&&t.status==='done');
  const records=App.db.samplingRecords.filter(r=>tasks.some(t=>t.id===r.taskId));

  const html=`
    <div class="stats-grid">
      <div class="stat-card c3"><div class="val">${tasks.length}</div><div class="lbl">已完成任务</div></div>
      <div class="stat-card c1"><div class="val">${records.length}</div><div class="lbl">采样记录</div></div>
    </div>
    <div class="panel"><div class="panel-header"><h3>✅ 已完成任务</h3></div><div class="panel-body">
      <table><thead><tr><th>项目编号</th><th>受检单位</th><th>日期</th><th>计划/实际</th><th>采样记录</th></tr></thead><tbody>
      ${tasks.map(t=>{
        const recs=App.db.samplingRecords.filter(r=>r.taskId===t.id);
        return `<tr>
          <td><strong>${t.pid}</strong></td><td>${getCompanyName(t.company)}</td>
          <td>${fmtDate(t.dateStart)}~${fmtDate(t.dateEnd)}</td>
          <td>${t.plannedHrs}h / ${t.actualHrs||'?'}h</td>
          <td>${recs.map(r=>{
            if(r.ports&&r.ports.length>0){
              return r.ports.map(p=>`<span class="tag tag-success" style="margin:2px" title="${p.note||''}">${p.name||'排口'} (${p.photoCount||0}张)</span>`).join('');
            }
            return `<span class="tag tag-success" style="margin:2px">📷 ${Object.values(r.photos||{}).filter(Boolean).length}张</span>`;
          }).join('')||'-'}</td>
        </tr>`;
      }).join('')}</tbody></table>
    </div></div>`;
  $('#contentArea').innerHTML=html;
  $('#headerActions').innerHTML='';
}

// ==================== RENDER PAGE ====================
function renderPage(page){
  const renders={
    dashboard:renderDashboard,tasks:()=>renderTasks(),dispatch:renderDispatch,
    personnel:renderPersonnel,companies:renderCompanies,
    mytasks:renderMyTasks,sampling:renderSampling,history:renderHistory
  };
  if(renders[page])renders[page]();
  updateRoleUI();
}

// ==================== INIT ====================
$$('.nav-item').forEach(item=>{
  item.addEventListener('click',()=>{
    const page=item.dataset.page;
    if(page)navigate(page);
  });
});

updateRoleUI();
renderDashboard();
</script>
