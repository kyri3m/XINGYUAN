<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>环境监测采样派单系统 - 登录</title>
<style>
:root {
  --primary: #6366f1; --primary-glow: rgba(99,102,241,.35);
  --bg: #09090b; --surface: #18181b; --surface2: #27272a;
  --text: #fafafa; --text2: #a1a1aa; --text3: #71717a;
  --border: rgba(255,255,255,.06); --radius: 12px;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg);min-height:100vh;display:flex;align-items:center;justify-content:center;-webkit-font-smoothing:antialiased}
.login-container{width:420px;max-width:92vw}
.login-header{text-align:center;margin-bottom:36px}
.login-header .icon{width:56px;height:56px;border-radius:16px;background:linear-gradient(135deg,var(--primary),#a855f7);display:inline-flex;align-items:center;justify-content:center;font-size:26px;margin-bottom:16px;box-shadow:0 0 30px var(--primary-glow)}
.login-header h1{font-size:22px;font-weight:800;color:var(--text);margin-bottom:6px;letter-spacing:-.03em}
.login-header p{font-size:14px;color:var(--text3)}
.login-card{background:var(--surface);border-radius:16px;padding:32px;border:1px solid var(--border)}
.form-group{margin-bottom:20px}
.form-group label{display:block;font-size:12px;color:var(--text2);margin-bottom:6px;font-weight:600}
.form-group input{width:100%;padding:10px 14px;border:1px solid var(--border);border-radius:var(--radius);font-size:14px;outline:none;transition:all .2s;background:var(--bg);color:var(--text);font-family:inherit}
.form-group input:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(99,102,241,.15)}
.form-group input::placeholder{color:var(--text3)}
.btn{width:100%;padding:11px;border-radius:99px;font-size:14px;cursor:pointer;border:none;font-weight:700;transition:all .2s;letter-spacing:-.01em}
.btn-primary{background:linear-gradient(135deg,var(--primary),#7c3aed);color:#fff;box-shadow:0 2px 16px var(--primary-glow)}
.btn-primary:hover{box-shadow:0 4px 24px var(--primary-glow);transform:translateY(-1px)}
.btn-primary:disabled{opacity:.5;cursor:not-allowed;transform:none;box-shadow:none}
.error-msg{color:#f87171;font-size:13px;margin-top:-8px;margin-bottom:14px;display:none;font-weight:500}
.error-msg.show{display:block}
.footer{text-align:center;margin-top:28px;font-size:12px;color:var(--text3)}
.footer a{color:var(--primary);text-decoration:none;font-weight:600}.footer a:hover{text-decoration:underline}
</style>
</head>
<body>
<div class="login-container">
  <div class="login-header">
    <div class="icon">🌿</div>
    <h1>环境监测采样派单系统</h1>
    <p>请登录您的账号</p>
  </div>
  <div class="login-card">
    <form id="loginForm">
      <div class="form-group">
        <label>用户名</label>
        <input type="text" id="username" placeholder="请输入用户名" autocomplete="username" required>
      </div>
      <div class="form-group">
        <label>密码</label>
        <input type="password" id="password" placeholder="请输入密码" autocomplete="current-password" required>
      </div>
      <div class="error-msg" id="errorMsg"></div>
      <button type="submit" class="btn btn-primary" id="loginBtn">登 录</button>
    </form>
  </div>
  <div class="footer">环境监测采样派单管理系统 v2.2 ｜ <a href="/register">注册账号</a></div>
</div>

<script>
const API = window.location.origin;

document.getElementById('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = document.getElementById('loginBtn');
  const err = document.getElementById('errorMsg');
  err.classList.remove('show');
  btn.disabled = true;
  btn.textContent = '登录中...';

  try {
    const res = await fetch(`${API}/api/auth/login`, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({
        username: document.getElementById('username').value,
        password: document.getElementById('password').value
      })
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.detail || '登录失败');

    var u=data.user;
    localStorage.setItem('tk', data.access_token);
    localStorage.setItem('mu', JSON.stringify({id:u.id,dn:u.display_name,rl:u.role_label||u.role,pm:u.permissions,role:u.role}));
    document.cookie = 'auth_token=' + data.access_token + ';path=/;max-age=86400;SameSite=Lax';
    window.location.href = '/index.html';
  } catch (ex) {
    console.error('Login error:', ex);
    err.textContent = ex.message || '登录失败，请检查网络连接';
    err.classList.add('show');
  } finally {
    btn.disabled = false;
    btn.textContent = '登 录';
  }
});
</script>
</body>
</html>
